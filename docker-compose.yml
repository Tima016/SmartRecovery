name: dfip-platform
# =====================================================================
# Digital Forensic Investigation Platform — Full Stack Docker Compose
# =====================================================================

networks:
  dfip-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:


services:

  # ─── PostgreSQL 15 ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: dfip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfip}
      POSTGRES_USER: ${POSTGRES_USER:-dfip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dfip-net
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfip} -d ${POSTGRES_DB:-dfip}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis 7 ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dfip-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dfip-net
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MinIO Object Storage ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: dfip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - dfip-net
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Backend API (NestJS) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfip-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dfip}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-dfip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_EVIDENCE_BUCKET: dfip-evidence
      MINIO_REPORTS_BUCKET: dfip-reports
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT_ACCESS_SECRET: dfip_access_secret_key_for_forensic_platform_2026
      JWT_REFRESH_SECRET: dfip_refresh_secret_key_for_forensic_platform_2026
      ENCRYPTION_KEY: d0af678c38a31fcdf78df681eb96edb8d7862098cb7b4dc3a720c9b0c265ab1f

    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dfip-net
    expose:
      - "5000"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Imaging Worker (BullMQ) ──────────────────────────────────────
  imaging-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dfip}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-dfip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      ENCRYPTION_KEY: d0af678c38a31fcdf78df681eb96edb8d7862098cb7b4dc3a720c9b0c265ab1f
    command: [ "node", "dist/src/workers/imaging.worker.js" ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dfip-net

  # ─── Forensic Pipeline Worker (BullMQ) ─────────────────────────────
  forensic-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dfip}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-dfip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      ENCRYPTION_KEY: d0af678c38a31fcdf78df681eb96edb8d7862098cb7b4dc3a720c9b0c265ab1f
    command: [ "node", "dist/src/workers/forensic-pipeline.worker.js" ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dfip-net

  # ─── Frontend (React + Vite + Nginx) ─────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfip-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dfip-net
    ports:
      - "7000:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Backup Cron (Daily automated backups) ──────────────────────
  backup:
    image: alpine:3.19
    container_name: dfip-backup
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - pg_data:/pg_data:ro
      - redis_data:/redis_data:ro
      - minio_data:/minio_data:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfip}
      POSTGRES_USER: ${POSTGRES_USER:-dfip}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      BACKUP_KEEP_COUNT: 7
    entrypoint: /bin/sh
    command: [ "-c", "echo 'Backup container ready. Run: docker compose exec backup sh /scripts/backup.sh'" ]
    networks:
      - dfip-net
