name: idfr-platform

# ═══════════════════════════════════════════════════════
# NETWORK
# ═══════════════════════════════════════════════════════
networks:
  idfr-net:
    driver: bridge

# ═══════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════
volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

# ═══════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════
services:

  # ─── PostgreSQL 15 ────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: idfr-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idfr}
      POSTGRES_USER: ${POSTGRES_USER:-idfr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - idfr-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idfr} -d ${POSTGRES_DB:-idfr}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"

  # ─── Redis ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: idfr-redis
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - idfr-net
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: idfr-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-idfr}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-idfr}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-changeme_set_in_env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idfr-net
    expose:
      - "5000"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend (React + nginx) ────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idfr-frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - idfr-net
    ports:
      - "7000:80"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
